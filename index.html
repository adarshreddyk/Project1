<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d1d" />
    <title>I love kannaya !!</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #eef2ff;
        --muted: #b4bddb;
        --card: rgba(18, 26, 58, 0.7);
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: #080d1d;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        width: 42rem;
        height: 42rem;
        border-radius: 50%;
        filter: blur(12px);
        opacity: 0.55;
        pointer-events: none;
      }

      body::before { background: #5538d8; top: -22rem; left: -12rem; }
      body::after { background: #00a8bd; bottom: -25rem; right: -13rem; }

      main {
        position: relative;
        width: min(90vw, 760px);
        padding: clamp(2rem, 7vw, 5rem);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 28px;
        background: var(--card);
        backdrop-filter: blur(16px);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
      }

      nav {
        position: absolute;
        top: 1.4rem;
        right: 1.6rem;
        display: flex;
        gap: 0.85rem;
      }

      nav a {
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 650;
        text-decoration: none;
        transition: color 160ms ease;
      }

      nav a:hover, nav a[aria-current="page"] { color: #fff; }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        margin: 0 0 1.4rem;
        color: #c9c5ff;
        font-size: 0.82rem;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        content: "";
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: #7df9d0;
        box-shadow: 0 0 14px #7df9d0;
      }

      h1 {
        margin: 0;
        font-size: clamp(3.2rem, 11vw, 7.4rem);
        line-height: 0.96;
        letter-spacing: -0.075em;
        background: linear-gradient(135deg, #ffffff 15%, #cbc4ff 50%, #70eaff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p {
        max-width: 34rem;
        margin: 1.75rem auto 0;
        color: var(--muted);
        font-size: clamp(1rem, 2.5vw, 1.22rem);
        line-height: 1.7;
      }

      .tag {
        display: inline-block;
        margin-top: 2.2rem;
        padding: 0.75rem 1rem;
        border: 1px solid rgba(125, 249, 208, 0.22);
        border-radius: 999px;
        color: #a8ffe6;
        background: rgba(125, 249, 208, 0.08);
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 0.88rem;
      }
    </style>
  </head>
  <body>
    <main>
      <nav aria-label="Primary navigation">
        <a href="index.html" aria-current="page">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="eyebrow">A fresh start</div>
      <h1>I love Kannay (Adbait)</h1>
      <p>A tiny page with a big welcome. Build something wonderful from here.</p>
      <span class="tag">&lt;made with curiosity /&gt;</span>
    </main>
  </body>
</html>
